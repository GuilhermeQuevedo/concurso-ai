# ==============================================================================
# Kernel Sysctl Hardening & Tuning for Engrama Platform (Hostinger KVM 1)
# Copiar para: /etc/sysctl.d/99-engrama-perf.conf
# Aplicar com: sudo sysctl --system
# ==============================================================================

# 1. Gerenciamento de Memória & Swap
# swappiness = 10: Só utiliza o swap em emergência absoluta, mantendo cache em RAM
vm.swappiness = 10
vm.dirty_ratio = 15
vm.dirty_background_ratio = 5

# 2. Conexões de Rede & TCP Backlog (Suporte a 1000 conexões simultâneas)
net.core.somaxconn = 2048
net.ipv4.tcp_max_syn_backlog = 2048
net.core.netdev_max_backlog = 2048

# Reutilização rápida de conexões TCP em estado TIME_WAIT
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15

# Janelas de buffer TCP adequadas para latência baixa
net.ipv4.tcp_rmem = 4096 87380 4194304
net.ipv4.tcp_wmem = 4096 65536 4194304

# 3. Descritores de Arquivos do Sistema
fs.file-max = 65535
