services:
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    command: >
      --innodb-buffer-pool-size=1280M
      --innodb-log-file-size=128M
      --max-connections=120
      --slow-query-log=1
      --slow-query-log-file=/var/log/mysql/slow.log
      --long-query-time=1
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-concurso_ai}
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./mariadb/my.cnf:/etc/mysql/conf.d/perf.cnf:ro
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: 1536M
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy noeviction
      --save ""
      --appendonly no
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-root}@mariadb:3306/${MYSQL_DATABASE:-concurso_ai}?connection_limit=12&pool_timeout=15
      REDIS_URL: redis://redis:6379
      NODE_OPTIONS: "--max-old-space-size=1024"
      JWT_SECRET: ${JWT_SECRET:-concurso-ai-development-jwt-secret-key-min-32-chars-long}
      REQUIRE_SUBSCRIPTION: "true"
      AI_PROVIDER: mock
    ports:
      - "3333:3333"
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: 1280M
        reservations:
          memory: 512M

volumes:
  mariadb_data:
