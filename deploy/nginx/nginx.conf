# ==============================================================================
# Nginx Hardened Main Configuration for Engrama (Hostinger KVM 1 - 1 vCPU, 4GB RAM)
# ==============================================================================

user www-data;
# Com 1 vCPU, 1 worker process evita context switching inútil
worker_processes 1;
# Limite de descritores de arquivos por processo para suportar alta concorrência
worker_rlimit_nofile 4096;
pid /run/nginx.pid;

events {
    # 2048 conexões simultâneas por worker
    worker_connections 2048;
    # Aceita tantas conexões quanto possível por ciclo de eventos
    multi_accept on;
    use epoll;
}

http {
    # Otimizações de rede do Kernel
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off;

    # Tipos MIME
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging com formato detalhado e buffering para não engargalar I/O
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main buffer=32k flush=5s;
    error_log /var/log/nginx/error.log warn;

    # Gzip Compression (economiza banda e acelera p95 em JSONs grandes)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # Zonas de Rate Limiting e Concorrência (10MB armazena ~160.000 IPs)
    # Auth: 5 req/s por IP
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    # API geral: 30 req/s por IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    # Limite de conexões ativas simultâneas por IP
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Código de status retornado ao estourar rate limit
    limit_req_status 429;
    limit_conn_status 429;

    # Upstream do Node.js com keepalive pool para evitar overhead de TCP handshake
    upstream engrama_backend {
        server 127.0.0.1:3333;
        keepalive 32;
    }

    # Inclusão das configurações dos sites
    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}
