# ==============================================================================
# Virtual Host Nginx para Engrama Platform (Hostinger KVM 1)
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _; # Altere para o seu domínio real, ex: engrama.app api.engrama.app

    client_max_body_size 25M;

    # Limite global de 30 conexões ativas por IP
    limit_conn conn_limit 30;

    # Configurações padrão de Proxy reverso para o Node.js
    proxy_http_version 1.1;
    proxy_set_header Connection ""; # Mantém keepalive com upstream ativo
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Timeouts gerais (evita segurar conexões zumbis)
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    # Buffers para respostas da API
    proxy_buffering on;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;

    # 1. Healthcheck sem rate limit (para uptime monitor, scripts de health e deploy)
    location = /api/health {
        proxy_pass http://engrama_backend;
        access_log off; # Não polui os logs com probes a cada 5s
    }

    # 2. Webhook Stripe sem rate limit (para nunca perder eventos de pagamento)
    location /api/payments/webhook {
        proxy_pass http://engrama_backend;
    }

    # 3. Rotas críticas de autenticação (proteção agressiva contra brute-force)
    location /api/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://engrama_backend;
    }

    # 4. Rotas de processamento pesado / IA (leitura longa permitida até 300s)
    location ~* ^/api/(study-schedules|edital-maps|questions/generate|essays/evaluate) {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://engrama_backend;
    }

    # 5. Demais rotas da API
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://engrama_backend;
    }

    # 6. Uploads de arquivos locais servidos diretamente pelo Nginx (zero overhead no Node)
    location /uploads/ {
        alias /var/www/engrama/apps/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # 7. Arquivos estáticos do Frontend SPA (Assets Vite com cache imutável)
    location /assets/ {
        alias /var/www/engrama/apps/frontend/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 8. Raiz do Frontend SPA (fallback para index.html ou proxy para Node)
    location / {
        root /var/www/engrama/apps/frontend/dist;
        try_files $uri $uri/ /index.html;
    }
}
