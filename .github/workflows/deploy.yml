name: Deploy Automático (Hostinger VPS)

on:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy para Produção
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Gerar Prisma client
        run: pnpm db:generate

      - name: Validar integridade (Lint)
        run: pnpm lint

      - name: Compilar pacote de produção (Front + Back)
        run: pnpm build:deploy

      - name: Configurar e sanitizar chave SSH
        env:
          SSH_KEY_RAW: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          node -e "
            const fs = require('fs');
            const path = require('path');
            const os = require('os');
            const raw = process.env.SSH_KEY_RAW || '';
            const match = raw.match(/-----\s*BEGIN[^-]+PRIVATE KEY\s*-----[\s\S]*?-----\s*END[^-]+PRIVATE KEY\s*-----/);
            if (!match) {
              console.error('ERRO: Bloco de chave privada não encontrado no secret VPS_SSH_KEY.');
              process.exit(1);
            }
            const block = match[0].replace(/\r/g, '').trim();
            const lines = block.split('\n').map(l => l.trim()).filter(Boolean);
            const hMatch = lines[0].match(/-----\s*BEGIN[^-]+PRIVATE KEY\s*-----/);
            const header = hMatch ? hMatch[0] : '-----BEGIN OPENSSH PRIVATE KEY-----';
            const fMatch = lines[lines.length - 1].match(/-----\s*END[^-]+PRIVATE KEY\s*-----/);
            const footer = fMatch ? fMatch[0] : '-----END OPENSSH PRIVATE KEY-----';
            const body = lines.slice(1, -1).join('').replace(/\s+/g, '');
            const chunks = body.match(/.{1,70}/g) || [];
            const formatted = [header, ...chunks, footer, ''].join('\n');
            const dest = path.join(os.homedir(), '.ssh', 'id_ed25519');
            fs.writeFileSync(dest, formatted, { mode: 0o600 });
            console.log('Chave privada SSH formatada e salva com sucesso.');
          "
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sincronizar pacote deploy com o VPS
        run: |
          rsync -avz --delete \
            -e "ssh -i /home/runner/.ssh/id_ed25519 -o StrictHostKeyChecking=no" \
            --exclude '.env' \
            --exclude 'node_modules' \
            --exclude 'uploads' \
            deploy/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/engrama/deploy/

      - name: Atualizar dependências e reiniciar PM2 no VPS
        run: |
          ssh -i /home/runner/.ssh/id_ed25519 -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            cd /opt/engrama/deploy
            npm install --omit=dev
            pm2 restart engrama --update-env || pm2 start server.mjs --name engrama
            pm2 save
          "
